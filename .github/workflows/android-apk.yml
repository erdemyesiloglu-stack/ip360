name: Android APK
on:
  push:
    branches: [android-app]
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Android projesini hazırla
        run: bash android-app/tool/prepare_android.sh "$RUNNER_TEMP/ip360-build"
      - name: Kaynak analizi ve testler
        working-directory: ${{ runner.temp }}/ip360-build
        run: |
          dart format lib test tool
          flutter analyze --fatal-infos
          flutter test
      - name: APK derle
        working-directory: ${{ runner.temp }}/ip360-build
        run: flutter build apk --release --split-per-abi
      - name: APK dosyalarını sakla
        uses: actions/upload-artifact@v4
        with:
          name: IP360-Android-APK
          path: ${{ runner.temp }}/ip360-build/build/app/outputs/flutter-apk/*release.apk
          if-no-files-found: error
          retention-days: 14
